# Type-check and build the site, so a broken build never reaches main.
name: check

# Runs once per PR, as the final check before merge (Actions minutes): PRs stay drafts while in development and
# review, and this fires when one is marked ready. Re-run by hand with `gh workflow run check --ref <branch>`.
on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node tools/check-dist.mjs
