# Type-check and build the site, so a broken build never reaches main.
name: check

# Manual only (Actions minutes): run once per PR, just before merge, with `gh workflow run check --ref <branch>`.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node tools/check-dist.mjs
